<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="A simple, private camera PWA designed for Chromebook tablets.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Simple Camera</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Private · On device</p>
        <h1>Simple Camera</h1>
      </div>
      <button id="installButton" class="icon-button hidden" type="button" aria-label="Install Simple Camera">＋</button>
    </header>

    <section class="camera-card" aria-label="Camera preview">
      <div class="preview-wrap">
        <video id="preview" autoplay muted playsinline></video>
        <canvas id="captureCanvas" class="hidden"></canvas>
        <div id="previewPlaceholder" class="preview-placeholder">
          <div class="camera-glyph">◉</div>
          <h2>Camera ready when you are</h2>
          <p>Allow camera access to take private photos on this device.</p>
          <button id="startButton" class="primary-button" type="button">Start camera</button>
        </div>
        <div id="gridOverlay" class="grid-overlay hidden" aria-hidden="true"></div>
        <div id="focusRing" class="focus-ring hidden" aria-hidden="true"></div>
        <div id="countdown" class="countdown hidden" aria-live="assertive"></div>
        <div id="statusPill" class="status-pill" role="status">Camera off</div>
      </div>
      <div class="toolbar" aria-label="Camera options">
        <button id="timerButton" class="tool-button" type="button" aria-label="Set timer" aria-pressed="false">Timer <span id="timerLabel">Off</span></button>
        <button id="gridButton" class="tool-button" type="button" aria-label="Toggle framing grid" aria-pressed="false">Grid</button>
        <button id="torchButton" class="tool-button" type="button" aria-label="Toggle flash" aria-pressed="false" disabled>Flash</button>
        <button id="switchButton" class="tool-button" type="button" aria-label="Switch camera">Switch</button>
      </div>
      <div class="capture-row">
        <button id="captureButton" class="shutter" type="button" aria-label="Take photo" disabled><span></span></button>
      </div>
    </section>

    <section class="gallery-section" aria-labelledby="galleryHeading">
      <div class="section-heading"><div><p class="eyebrow">Saved on this device</p><h2 id="galleryHeading">Recent photos</h2></div><button id="clearButton" class="text-button" type="button">Clear all</button></div>
      <div id="gallery" class="gallery" aria-live="polite"><p class="empty-state">Photos you take will appear here.</p></div>
    </section>

    <p id="errorMessage" class="error-message hidden" role="alert"></p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
