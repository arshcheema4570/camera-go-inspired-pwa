<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lumen Camera</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Lumen Camera — on-device computational photography. No cloud, no account.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./styles.css?v=14">
</head>
<body>

<div class="preview-wrap">
  <video id="preview" class="viewfinder" autoplay muted playsinline></video>
  <button id="flashButton" class="pill-btn flash-btn" aria-pressed="false" title="Flash">
    <span class="ico">&#9889;</span><span class="val" id="flashVal">off</span>
  </button>
  <div id="focusRing" class="focus-ring hidden" aria-hidden="true"></div>
</div>
<canvas id="captureCanvas" class="hidden"></canvas>

<div class="controls">
  <div class="zoomdial-wrap">
    <div id="zoomDial" class="zoomdial" role="slider" tabindex="0" aria-label="Zoom"
         aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
      <div id="zoomStrip" class="zoomdial-strip"></div>
      <div class="zoomdial-center"></div>
    </div>
    <span id="zoomLabel">1.0&times;</span>
  </div>

  <button id="captureButton" class="shutter" aria-label="Take photo" disabled><span>&#9673;</span></button>

  <div class="bottombar">
    <button id="galleryThumbButton" class="gthumb" aria-label="Open last photo">
      <span class="gallery-empty">&#128444;</span>
      <img id="galleryThumb" class="hidden" alt="Last captured photo">
    </button>
    <button id="switchButton" class="pill-btn" aria-label="Switch camera">&#8646;</button>
  </div>
</div>

<div id="viewerOverlay" class="viewer hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="viewerImage" alt="Captured photo">
</div>

<div id="previewPlaceholder" class="enable-wrap">
  <h1>LUMEN</h1>
  <button id="startButton" class="primary-btn">Start camera</button>
  <p id="errorMessage" class="error-message hidden" role="alert"></p>
</div>

<div id="processing" hidden>
  <div class="spinner"></div>
  <div id="procStage">Capturing&hellip;</div>
</div>
<div id="flashZap"></div>
<div id="toast"></div>

<script src="./app.js?v=14"></script>
<script src="./camera-pipeline.js?v=14"></script>
</body>
</html>
