<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="A private Camera Go-inspired camera with burst capture and neural photo enhancement for Chromebook tablets.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Lumen Camera</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div class="brand"><span class="brand-dot"></span><span>Lumen Camera</span></div><button id="settingsButton" class="round-button" type="button" aria-label="Camera settings">⋮</button></header>
    <section class="camera-card" aria-label="Camera">
      <div class="preview-wrap"><video id="preview" autoplay muted playsinline></video><canvas id="captureCanvas" class="hidden"></canvas><div id="previewPlaceholder" class="preview-placeholder"><div class="camera-glyph">◉</div><p>Camera Go-inspired capture for Chromebook</p><button id="startButton" class="primary-button" type="button">Start camera</button></div><div id="gridOverlay" class="grid-overlay hidden" aria-hidden="true"></div><div id="focusRing" class="focus-ring hidden" aria-hidden="true"></div><div id="countdown" class="countdown hidden" aria-live="assertive"></div><div id="statusPill" class="status-pill" role="status">Camera off</div><div class="top-controls"><button id="flashButton" class="preview-button" type="button" aria-label="Toggle flash" aria-pressed="false" disabled>⚡</button><button id="switchButton" class="preview-button" type="button" aria-label="Switch camera">↻</button></div></div>
      <div class="camera-tools"><button id="timerButton" class="tool-button" type="button" aria-label="Set timer" aria-pressed="false">Timer <span id="timerLabel">Off</span></button><button id="gridButton" class="tool-button" type="button" aria-label="Toggle grid" aria-pressed="false">Grid</button><label class="zoom-control" aria-label="Zoom"><span>1×</span><input id="zoomRange" type="range" min="1" max="1" step="0.1" value="1" disabled><span id="zoomLabel">1×</span></label></div>
      <div class="mode-strip" role="tablist" aria-label="Camera mode"><button class="mode active" data-mode="photo" role="tab" aria-selected="true">Photo</button><button class="mode" data-mode="portrait" role="tab" aria-selected="false">Portrait</button><button class="mode" data-mode="night" role="tab" aria-selected="false">Night</button></div>
      <div class="shutter-row"><div class="shutter-spacer"></div><button id="captureButton" class="shutter" type="button" aria-label="Take photo" disabled><span></span></button><button id="openEnhancerButton" class="review-button" type="button" aria-label="Open last photo" disabled>▣</button></div>
    </section>
    <section id="enhancer" class="enhancer hidden" aria-labelledby="enhancerHeading"><div class="section-heading"><div><p class="eyebrow">Burst + neural processing</p><h2 id="enhancerHeading">Make your photo pop</h2></div><button id="closeEnhancerButton" class="text-button" type="button">Close</button></div><div class="enhance-preview"><img id="enhancedPreview" alt="Captured photo preview"></div><div class="enhance-actions"><button id="downloadButton" class="primary-button" type="button">Save photo</button></div><p id="enhanceStatus" class="helper-text">Processing locally…</p></section>
    <p id="errorMessage" class="error-message hidden" role="alert"></p>
  </main>
  <script type="module" src="./app.js?v=7"></script>
</body>
</html>
