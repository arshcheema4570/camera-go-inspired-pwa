<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Camera</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Lumen Camera — on-device computational photography. No cloud, no account.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./styles.css?v=19">
</head>
<body>

<div class="preview-wrap">
  <video id="preview" class="viewfinder" autoplay muted playsinline></video>
  <button id="flashButton" class="flash-toggle" type="button" role="switch" aria-checked="false" title="Flash unavailable until the camera starts" aria-label="Flash unavailable until the camera starts" disabled>
    <svg class="flash-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2.8 5.8 13h5.3l-1 8.2L18.2 11h-5.3l.3-8.2Z"/></svg>
    <span class="flash-toggle-track"><span class="flash-toggle-thumb"></span></span>
    <span class="flash-toggle-label">N/A</span>
  </button>
  <button id="proButton" class="pro-toggle" type="button" role="switch" aria-checked="false" title="Pro filter off" aria-label="Pro filter off">
    <span class="pro-toggle-text">PRO</span>
    <span class="flash-toggle-track"><span class="flash-toggle-thumb"></span></span>
  </button>
</div>
<canvas id="captureCanvas" class="hidden"></canvas>

<div class="controls">
  <div class="zoom-control">
    <label for="zoomSlider">Zoom <output id="zoomLabel" for="zoomSlider">1.0&times;</output></label>
    <input id="zoomSlider" type="range" min="1" max="4" step="0.1" value="1" aria-label="Zoom">
  </div>

  <button id="captureButton" class="shutter" aria-label="Take photo" disabled><span>&#9673;</span></button>

  <div class="bottombar">
    <button id="galleryThumbButton" class="gthumb" aria-label="Open last photo">
      <span class="gallery-empty">&#128444;</span>
      <img id="galleryThumb" class="hidden" alt="Last captured photo">
    </button>
    <button id="switchButton" class="pill-btn" aria-label="Switch camera">&#8646;</button>
  </div>
</div>

<div id="viewerOverlay" class="viewer hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="viewerImage" alt="Captured photo">
</div>

<div id="previewPlaceholder" class="enable-wrap">
  <h1>LUMEN</h1>
  <button id="startButton" class="primary-btn">Start camera</button>
  <p id="errorMessage" class="error-message hidden" role="alert"></p>
</div>

<div id="processing" hidden>
  <div class="spinner"></div>
  <div id="procStage">Capturing&hellip;</div>
</div>
<div id="screenFlash" aria-hidden="true"></div>
<div id="toast"></div>

<script src="./lumen-filter.js?v=19"></script>
<script src="./camera-pipeline.js?v=19"></script>
</body>
</html>
